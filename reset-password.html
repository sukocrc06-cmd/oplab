<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Şifre Sıfırlama — OptiPulseLab</title>
    <!-- (7 Eylül 2026) Appwrite'ın şifre sıfırlama e-postasındaki link
         kullanıcıyı buraya (?userId=...&secret=...) yönlendirir. Bu sayfa
         ana uygulamadan BAĞIMSIZ, küçük ve kendi kendine yeten bir sayfa —
         ana index.html'in giriş kapısını/motoru hiç yüklemiyor, sadece
         Appwrite'ın account.updateRecovery() çağrısını yapıp yeni şifreyi
         kaydediyor. -->
    <link rel="stylesheet" href="styles.min.css?v=20260907a">
    <style>
        body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--bg-main); margin: 0; }
    </style>
</head>
<body>
    <div class="oplab-auth-gate" style="position: static; background: none;">
        <div class="oplab-auth-card">
            <div class="oplab-auth-logo"><span class="oplab-auth-logo-dot"></span>OPTIPULSELAB</div>
            <p class="oplab-auth-subtitle" id="reset-subtitle">Hesabın için yeni bir şifre belirle.</p>

            <form id="reset-form">
                <input type="password" id="reset-password" class="form-input" placeholder="Yeni şifren (en az 8 karakter)..." autocomplete="new-password" required minlength="8">
                <input type="password" id="reset-password-confirm" class="form-input" placeholder="Yeni şifreni tekrar gir..." autocomplete="new-password" required minlength="8" style="margin-top:10px;">
                <button type="submit" class="btn btn-primary" id="reset-submit" style="width:100%;margin-top:14px;">Şifreyi Güncelle</button>
            </form>

            <div class="oplab-auth-status" id="reset-status"></div>
            <a href="index.html" class="oplab-auth-skip" style="text-decoration:underline;display:block;margin-top:16px;">← Giriş sayfasına dön</a>
        </div>
    </div>

    <script defer src="https://cdn.jsdelivr.net/npm/appwrite@16"></script>
    <script defer src="oplabAppwriteConfig.js?v=20260907a"></script>
    <script defer>
        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const userId = params.get('userId');
            const secret = params.get('secret');
            const form = document.getElementById('reset-form');
            const statusEl = document.getElementById('reset-status');
            const submitBtn = document.getElementById('reset-submit');
            const subtitleEl = document.getElementById('reset-subtitle');

            function showStatus(msg, kind) {
                statusEl.textContent = msg || '';
                statusEl.classList.remove('is-error', 'is-info');
                if (kind) statusEl.classList.add(kind === 'error' ? 'is-error' : 'is-info');
            }

            if (!userId || !secret) {
                subtitleEl.textContent = 'Bu link eksik veya geçersiz görünüyor.';
                form.style.display = 'none';
                showStatus('E-postandaki şifre sıfırlama linkine tekrar tıklamayı dene, veya giriş ekranından "Şifremi unuttum" ile yeni bir link iste.', 'error');
                return;
            }

            const cfg = window.OPLAB_APPWRITE_CONFIG;
            if (!cfg || !window.Appwrite || cfg.projectId.indexOf('BURAYA_YAPISTIR') !== -1) {
                form.style.display = 'none';
                showStatus('E-posta girişi henüz kurulmadı.', 'error');
                return;
            }
            const client = new Appwrite.Client().setEndpoint(cfg.endpoint).setProject(cfg.projectId);
            const account = new Appwrite.Account(client);

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const pw = document.getElementById('reset-password').value;
                const pwConfirm = document.getElementById('reset-password-confirm').value;
                if (pw !== pwConfirm) { showStatus('Şifreler eşleşmiyor.', 'error'); return; }
                if (pw.length < 8) { showStatus('Şifre en az 8 karakter olmalı.', 'error'); return; }
                submitBtn.disabled = true;
                showStatus('', null);
                account.updateRecovery(userId, secret, pw)
                    .then(() => {
                        form.style.display = 'none';
                        subtitleEl.textContent = 'Şifren güncellendi!';
                        showStatus('Artık ana sayfadan yeni şifrenle giriş yapabilirsin.', 'info');
                    })
                    .catch(err => {
                        showStatus(err && err.message ? err.message : 'Şifre güncellenemedi, linkin süresi dolmuş olabilir — yeni bir sıfırlama linki iste.', 'error');
                    })
                    .finally(() => { submitBtn.disabled = false; });
            });
        });
    </script>
</body>
</html>
